version: '3.8'

services:
  dashboard:
    build: .
    container_name: sentinel_dashboard
    ports:
      - "5001:5001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app

  orchestrator:
    build: .
    container_name: sentinel_orchestrator
    command: python3 monitor.py
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app